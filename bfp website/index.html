<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFP Region IV-A Bulletin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <div class="mark">
      <span class="mark-seal">BFP</span>
      <div class="mark-text">
        <strong>Bureau of Fire Protection</strong>
        <span>Regional Office IV-A &middot; Bulletin</span>
      </div>
    </div>
    <div class="account-area">
      <span id="accountEmail" class="account-email hidden"></span>
      <button id="signOutBtn" class="pill-btn pill-btn-outline hidden">Sign out</button>
      <button id="composerToggle" class="pill-btn pill-btn-solid">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Post an update
      </button>
    </div>
  </div>
</header>

<main class="layout">

  <!-- Left rail: category board -->
  <aside class="rail">
    <div class="rail-block">
      <h4 class="rail-heading">Board</h4>
      <nav class="rail-nav" aria-label="Filter by category">
        <button class="chip active" data-filter="all">
          <span class="rail-dot rail-dot-all"></span>All updates
        </button>
        <button class="chip" data-filter="memorandum">
          <span class="rail-dot rail-dot-memorandum"></span>Memorandum
        </button>
        <button class="chip" data-filter="news">
          <span class="rail-dot rail-dot-news"></span>News
        </button>
        <button class="chip" data-filter="advisory">
          <span class="rail-dot rail-dot-advisory"></span>Advisory
        </button>
      </nav>
    </div>

    <div class="rail-block">
      <h4 class="rail-heading">Coverage</h4>
      <ul class="rail-list">
        <li>Cavite</li>
        <li>Laguna</li>
        <li>Batangas</li>
        <li>Rizal</li>
        <li>Quezon</li>
      </ul>
    </div>
  </aside>

  <div class="feed-column">

    <!-- Composer -->
    <section id="composer" class="panel-card hidden">
      <div class="panel-badge" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <span class="panel-eyebrow">New post</span>
      <h2>File a new update</h2>
      <form id="postForm">
        <label class="field">
          <span>Category</span>
          <div class="segmented" id="categorySegmented">
            <button type="button" class="segmented-option active" data-value="memorandum">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h6"/></svg>
              Memorandum
            </button>
            <button type="button" class="segmented-option" data-value="news">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8Z"/><path d="M7 12h6M7 15h4"/></svg>
              News
            </button>
            <button type="button" class="segmented-option" data-value="advisory">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a1.8 1.8 0 0 0 1.6 2.7h17.2a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.8 1.8 0 0 0-3.4 0z"/></svg>
              Advisory
            </button>
          </div>
          <input type="hidden" id="postCategory" value="memorandum">
        </label>

        <label class="field">
          <span>Title</span>
          <input id="postTitle" type="text" required maxlength="140" placeholder="e.g. Revised Duty Roster for September">
        </label>

        <label class="field">
          <span>Details</span>
          <textarea id="postBody" rows="4" placeholder="Write the memorandum or update here..."></textarea>
        </label>

        <div class="field-row">
          <label class="field">
            <span>Station</span>
            <input id="postStation" type="text" placeholder="e.g. Calamba City FS">
          </label>
          <label class="field">
            <span>Province</span>
            <input id="postProvince" type="text" placeholder="e.g. Laguna">
          </label>
        </div>

        <label class="field">
          <span>Attachments (images)</span>
          <input id="postImages" type="file" accept="image/*" multiple>
          <div id="imagePreview" class="image-preview"></div>
        </label>

        <div class="panel-actions">
          <button type="button" id="cancelPost" class="pill-btn pill-btn-ghost">Cancel</button>
          <button type="submit" class="pill-btn pill-btn-solid" id="submitPost">Publish</button>
        </div>
      </form>
    </section>

    <!-- Mobile-only filter row (mirrors rail on small screens) -->
    <nav class="filters-mobile" aria-label="Filter by category, mobile">
      <button class="chip-mobile-mirror active" data-mirror-filter="all">All</button>
      <button class="chip-mobile-mirror" data-mirror-filter="memorandum">Memorandum</button>
      <button class="chip-mobile-mirror" data-mirror-filter="news">News</button>
      <button class="chip-mobile-mirror" data-mirror-filter="advisory">Advisory</button>
    </nav>

    <!-- Feed -->
    <section id="feed" class="feed">
      <p class="feed-loading">Loading posts…</p>
    </section>

  </div>

</main>

<template id="postCardTemplate">
  <article class="card">
    <div class="card-inner">
      <header class="card-head">
        <span class="patch">
          <span class="tag"></span>
        </span>
        <div class="card-headline">
          <span class="card-category"></span>
          <h3 class="card-title"></h3>
          <div class="card-meta">
            <span class="card-author"></span>
            <span class="card-sep">|</span>
            <span class="card-date"></span>
            <span class="card-station"></span>
          </div>
        </div>
      </header>
      <p class="card-body"></p>
      <div class="card-images"></div>
    </div>
  </article>
</template>

<div id="lightbox" class="lightbox hidden">
  <button id="lightboxClose" class="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script type="module" src="app.js"></script>
<script>
  document.querySelectorAll('.chip-mobile-mirror').forEach(mirror => {
    mirror.addEventListener('click', () => {
      const filter = mirror.dataset.mirrorFilter;
      document.querySelectorAll('.chip-mobile-mirror').forEach(m => m.classList.toggle('active', m === mirror));
      const real = document.querySelector(`.rail .chip[data-filter="${filter}"]`);
      if (real) real.click();
    });
  });
</script>
</body>
</html>
